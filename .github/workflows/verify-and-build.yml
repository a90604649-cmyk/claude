name: Verify and Build

concurrency:
  group: autocontinue-beta3-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run dist

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Claude-AutoContinue-Beta3-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
